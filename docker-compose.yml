
services:
  db:
    image: postgres:16
    container_name: teslamama-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teslamama
    ports:
      - "5434:5432"
    volumes:
      - teslamama_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teslamama"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  teslamama_data:
